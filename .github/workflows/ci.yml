name: CI

# Pull requests and main. The `test` job is the quality gate: formatting, vet,
# every test with the race detector, and 100% statement coverage. The gate
# compares covered with total statements in the cover profile, exactly; there
# is no threshold to set. The release workflow refuses to release a commit this
# workflow did not pass (require_workflow_success: CI), so nothing uncovered
# can ship.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a superseded pull-request run is cancelled: cancelling a run on main
  # would make the release guard see a cancelled CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Format, vet, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Module files are tidy
        run: go mod tidy -diff
      - name: Test with the race detector
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: Every statement is covered
        run: go run ./cmd/covergate cover.out

  package:
    name: GoReleaser check and snapshot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: check
      - name: Snapshot build of every release artifact
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: Run the packaged linux binary
        run: |
          set -eu
          bin="$(find dist -type f -name meaninggraph -path '*linux_amd64*')"
          "$bin" --version
          "$bin" check testdata/corpus/core --address github.com/meaninggraph/core --profile universal
