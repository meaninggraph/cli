name: Release

# Continuous delivery: every merge to main runs the shared strongo/cicd release
# workflow, which derives the next version from conventional commits (a
# `feat:` or `fix:` merge releases; docs, chore, test and ci merges release
# nothing), tags it, and publishes the archives and SHA-256 checksums
# GoReleaser builds as a GitHub release. It then downloads the published
# archives and runs them. Pushing an explicit vX.Y.Z tag releases that exact
# version.
#
# Nothing here needs a secret: the default GITHUB_TOKEN creates the tag and the
# release, and there is no publisher (tap, bucket, store) that would need
# another token. Adding macOS signing later takes two things together: the five
# credentials as secrets forwarded below, and require_notarized_macos: true
# (the shared workflow refuses signing secrets without that gate).
#
# The release refuses to run unless the CI workflow (formatting, vet, tests with
# the race detector, 100% statement coverage, GoReleaser check and snapshot
# build) is green for the same commit, so nothing uncovered can be released.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Pinned to an exact tag, not a moving major.
    uses: strongo/cicd/.github/workflows/release.yml@v1.21.0
    permissions:
      contents: write
      # Lets require_workflow_success read the CI result for this commit.
      actions: read
    with:
      # Names the workflow's `name:`, not its file.
      require_workflow_success: 'CI'
      # Matches go.mod's go directive.
      go_version: '1.27.0'
      # Pre-1.0: a breaking commit is capped to a minor bump. Cut v1.0.0 by
      # pushing that tag deliberately.
      allow_major_version_bump: false
