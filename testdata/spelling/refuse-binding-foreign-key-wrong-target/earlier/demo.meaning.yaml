format: meaning/draft-1
id: demo
name: Demo
description: A demo graph.
models: {shop: shop.modelspec.hcl}
concepts:
  - id: invoice
    kind: entity
    labels: {en: invoice}
    description: An invoice.
    bindings:
      - model: modelspec:///shop.Invoice
        role: entity
  - id: invoice-customer
    kind: attribute
    labels: {en: invoice-customer}
